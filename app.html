button,input,select,textarea{font-family:inherit}
button{color:inherit}
a{color:var(--gold)}
[hidden]{display:none!important}
::selection{background:var(--gold-soft)}
.sora{font-family:var(--font-display)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- icons ---------- */
.ico{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab .ico{width:22px;height:22px}
.icon-btn .ico{width:18px;height:18px}
.fab .ico{width:26px;height:26px;stroke-width:2.4}
.icon-inline .ico{width:19px;height:19px}
.round .ico{width:20px;height:20px;margin-left:-1px}
.bdg .e .ico{width:24px;height:24px}
.icon-mini svg{width:14px;height:14px}
.d-item .ico{width:18px;height:18px;color:var(--text-dim)}

/* ---------- header: a floating glass capsule over the scrolling page ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;transform:translateZ(0);pointer-events:none}
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 30px);background:linear-gradient(var(--bg) 30%,transparent);z-index:-1}
.topbar-in,.timer{pointer-events:auto}
.topbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 7px 6px 16px;border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.brand{display:flex;align-items:center;gap:0;font-family:var(--font-display);font-weight:800;font-size:1.12rem;letter-spacing:.01em;min-width:0}
.brand-mark{width:26px;height:26px;margin-right:10px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--hole) 0 36%,transparent 38%),var(--mark);box-shadow:0 0 16px -2px var(--glow),inset 0 0 0 1px rgba(255,255,255,.2)}
.brand .dot{color:var(--gold)}
.brand-sub{font-weight:600;color:var(--text-dim);font-size:.8rem;margin-left:7px}
@media (max-width:400px){:root[data-look="nebula"] .brand-sub{display:none}}
@media (max-width:360px){.brand-sub{display:none}}
@media (max-width:340px){.topbar-in{padding-left:12px;gap:8px}.lvl .xpbar{display:none}.lvl{padding-right:7px}}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);transition:transform .15s var(--ease),background .2s}
.icon-btn:active{transform:scale(.92)}
@media (hover:hover){.icon-btn:hover{background:var(--card-2);color:var(--text)}}

/* level chip */
.lvl{display:flex;align-items:center;gap:8px;height:40px;padding:0 13px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.74rem;font-weight:700}
.lvl .badge{width:30px;height:30px;border-radius:50%;background:var(--grad);color:var(--on-gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:.8rem;font-weight:800;box-shadow:0 0 12px -2px var(--glow),inset 0 1px 0 rgba(255,255,255,.4)}
.lvl .xpbar{width:42px;height:5px;border-radius:5px;background:var(--card-2);overflow:hidden}
.lvl .xpbar div{height:100%;border-radius:5px;background:var(--grad);transition:width .5s var(--ease)}

/* focus timer pill */
.timer{max-width:720px;margin:8px auto 0;display:flex;align-items:center;gap:10px;background:var(--grad);color:var(--on-gold);border-radius:28px;padding:8px 8px 8px 18px;box-shadow:0 12px 28px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.4)}
.timer .tt{font-family:var(--font-num);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.timer .tn{flex:1;min-width:0;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.timer button{width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.16);color:inherit;cursor:pointer;font-size:.85rem;display:grid;place-items:center}
.timer.paused{background:var(--surface);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--line-2)}
.timer.paused button{background:var(--card-2)}

/* ---------- page ---------- */
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:calc(var(--topbar-h,72px) + 8px) 16px calc(130px + env(safe-area-inset-bottom))}
@media (min-width:1000px){.topbar-in,.timer{max-width:960px} main{max-width:960px}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-in.enter > *{animation:enter .42s var(--ease) both}
.view-in.enter > :nth-child(2){animation-delay:.03s}
.view-in.enter > :nth-child(3){animation-delay:.06s}
.view-in.enter > :nth-child(4){animation-delay:.09s}
.view-in.enter > :nth-child(5){animation-delay:.12s}
.view-in.enter > :nth-child(6){animation-delay:.15s}
.view-in.enter > :nth-child(n+7){animation-delay:.18s}
.eyebrow{color:var(--text-dim);font-size:.8rem;margin:6px 2px 4px;font-weight:600;letter-spacing:.02em}
.h1{font-family:var(--font-display);font-size:1.7rem;font-weight:800;margin:2px 0 18px;line-height:1.15;letter-spacing:-.02em}
:root[data-look="nebula"] .h1{font-size:1.5rem;letter-spacing:-.01em}
.accent{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.accent{background:none;color:var(--gold);-webkit-text-fill-color:currentColor}}
.today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.today-head .h1{margin-bottom:14px}
:root[data-look="nebula"] .today-head .h1{font-size:clamp(1.2rem,5.6vw,1.5rem)}

.card{background:linear-gradient(160deg,var(--glass-1),var(--glass-2));border:1px solid var(--line);border-radius:var(--radius);padding:6px 16px;box-shadow:var(--shadow),inset 0 1px 0 var(--hi);margin-bottom:14px}
.card.pad{padding:18px}
.card[data-act]{cursor:pointer}
.label{display:flex;align-items:center;justify-content:space-between;font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin:26px 6px 10px}
.label .count{background:var(--card-2);color:var(--text-2);border-radius:999px;padding:2px 9px;font-size:.66rem;letter-spacing:0}
.empty{color:var(--text-dim);font-size:.86rem;padding:20px 8px;text-align:center;line-height:1.5}
.empty b{color:var(--text);display:block;font-size:.95rem;margin-bottom:2px}

/* ---------- buttons ---------- */
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;padding:13px 18px;border-radius:999px;border:none;background:var(--grad);color:var(--on-gold);font-weight:700;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 10px 24px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:none}
.btn.soft{background:var(--card-2);color:var(--text);box-shadow:inset 0 1px 0 var(--hi)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border:1.5px solid color-mix(in srgb,var(--danger) 60%,transparent);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{flex:0 0 auto;min-width:0;padding:9px 15px;font-size:.78rem}

/* ---------- Today: the black-hole hero ---------- */
.hero{position:relative;overflow:hidden;margin-top:4px;padding:20px;border-radius:32px;border:1px solid color-mix(in srgb,var(--gold) 34%,var(--line));
  background:radial-gradient(95% 130% at 0% 0%,var(--gold-soft),transparent 62%),linear-gradient(160deg,var(--glass-1),var(--glass-2));box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi)}
.hero::after{content:"";position:absolute;right:-70px;bottom:-96px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,transparent 40%,var(--glow) 55%,transparent 70%);opacity:.5;pointer-events:none}
.hero-top{position:relative;z-index:1;display:flex;gap:20px;align-items:center}
.hero .btn-row{position:relative;z-index:1;margin-top:18px}
.ring{flex:none;position:relative;width:96px;height:96px}
.ring::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,transparent 44%,var(--glow) 58%,transparent 72%);filter:blur(5px);opacity:.85}
.ring svg{position:relative;display:block;overflow:visible}
.rg-orbit{transform-box:view-box;transform-origin:50% 50%;animation:orbit 18s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;pointer-events:none}
.ring .rv b{font-family:var(--font-num);font-size:1.25rem;line-height:1}
.ring .rv span{font-size:.62rem;color:rgba(255,255,255,.76);margin-top:3px;letter-spacing:.05em}
.hero-body{flex:1;min-width:0}
.coach-tag{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.coach-note{font-size:.95rem;line-height:1.5;color:var(--text);overflow-wrap:anywhere}
.coach-note.small{font-size:.85rem;line-height:1.55;color:var(--text-2)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{padding:14px 8px 12px;text-align:center;border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass-1),var(--glass-2));box-shadow:inset 0 1px 0 var(--hi)}
.tile .ti{display:flex;justify-content:center;color:var(--gold);margin-bottom:6px}
.tile .ti .ico{width:18px;height:18px}
.tile .v{font-family:var(--font-num);font-size:1.35rem;font-weight:800;line-height:1.1;white-space:nowrap}
.tile .k{font-size:.68rem;color:var(--text-dim);margin-top:3px}
.tiles.four{grid-template-columns:repeat(2,1fr)}
.tiles + .card{margin-top:14px}
@media (min-width:560px){.tiles.four{grid-template-columns:repeat(4,1fr)}}

/* ---------- task rows ---------- */
.task{display:flex;align-items:center;gap:13px;padding:13px 0}
.task + .task{border-top:1px solid var(--line)}
.check{position:relative;width:26px;height:26px;border-radius:50%;border:2px solid var(--text-dim);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;padding:0;transition:background .18s,border-color .18s,box-shadow .18s}
.check::before{content:"";position:absolute;inset:-9px}
.check.done{background:var(--grad);border-color:transparent;box-shadow:0 0 0 4px var(--gold-soft);animation:pop .3s var(--ease)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.check svg{width:13px;height:13px;opacity:0}
.check.done svg{opacity:1}
.t-main{flex:1;min-width:0;cursor:pointer}
.t-text{font-size:.95rem;line-height:1.38;word-break:break-word}
.task.done .t-text{color:var(--done);text-decoration:line-through}
.t-meta{font-size:.7rem;color:var(--text-dim);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.66rem;padding:3px 9px;border-radius:999px;background:var(--card-2);color:var(--text-2);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.high,.chip.over{background:var(--danger-soft);color:var(--danger)}
.chip.due{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip.tag{background:var(--card-2);color:var(--text-dim);cursor:pointer;padding:3px 10px}
.chip.tag.on{background:var(--gold-soft);color:var(--gold)}
@media (hover:hover){.chip.tag:hover{background:var(--gold-soft);color:var(--gold)}}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--gold-soft);cursor:pointer;flex:none;font-size:.72rem;color:var(--gold);display:grid;place-items:center;transition:transform .15s var(--ease)}
.play:active{transform:scale(.9)}

/* ---------- tasks tab: search + filter chips ---------- */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;-webkit-appearance:none;appearance:none;background:linear-gradient(160deg,var(--glass-1),var(--glass-2));border:1px solid var(--line);color:var(--text);padding:14px 18px 14px 44px;border-radius:999px;font-size:16px;box-shadow:inset 0 1px 0 var(--hi)}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.search input::placeholder{color:var(--text-dim)}
.search .si{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:1rem;pointer-events:none}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
.filters::after{content:"";flex:none;width:18px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--text-2);border-radius:999px;padding:8px 14px;font-size:.78rem;cursor:pointer;font-weight:600;transition:transform .15s var(--ease)}
.fchip:active{transform:scale(.95)}
.fchip.on{background:var(--grad);color:var(--on-gold);border-color:transparent;box-shadow:0 8px 18px -10px var(--glow)}
select.fchip{color-scheme:inherit}

/* ===== Event Horizon · views: Tasks (planets + moons), Progress, Atlas chat + composer ===== */

/* segmented control (Tasks view switch, sheet priority, timers) */
.seg{display:flex;gap:4px;flex-wrap:wrap;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;min-width:64px;border:none;background:transparent;color:var(--text-2);padding:10px 12px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer;transition:background .2s,color .2s,transform .15s var(--ease)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--grad);color:var(--on-gold);box-shadow:0 8px 18px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.seg.priority button.on[data-v="high"]{background:var(--danger);color:var(--on-danger);box-shadow:none}
.seg.priority button.on[data-v="low"]{background:var(--raise);color:var(--text);box-shadow:none}

/* ---------- planets: project orbs ---------- */
.p-mono{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:.8rem;letter-spacing:.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:radial-gradient(circle at 28% 22%,hsl(var(--ah,42) 90% 68%) 0,hsl(var(--ah,42) 72% 27%) 26%,hsl(var(--ah,42) 70% 15%) 100%);
  box-shadow:0 0 16px -3px hsl(var(--ah,42) 85% 58% / .65),inset 0 0 0 1px hsl(var(--ah,42) 90% 82% / .25),inset -4px -6px 9px rgba(0,0,0,.35)}
.p-mono.lg{width:48px;height:48px;font-size:1rem}
.p-ring{width:52px;height:52px;border-radius:50%;flex:none;padding:3px;display:grid;place-items:center;
  background:conic-gradient(from 0deg,hsl(var(--ah,42) 90% 64%) calc(var(--pct,0) * 1%),var(--card-2) 0)}
.p-ring.lg{width:62px;height:62px;padding:3.5px}
.p-ring .p-mono,.p-ring .p-mono.lg{width:100%;height:100%;font-size:.85rem}
.p-ring.lg .p-mono.lg{font-size:1.05rem}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.p-card{position:relative;overflow:hidden;text-align:left;cursor:pointer;color:var(--text);padding:16px 16px 15px;border-radius:28px;
  border:1px solid var(--line);border:1px solid color-mix(in srgb,hsl(var(--ah,42) 80% 60%) 28%,var(--line));
  background:radial-gradient(130% 90% at 100% 0%,color-mix(in srgb,hsl(var(--ah,42) 80% 58%) 20%,transparent),transparent 62%),linear-gradient(160deg,var(--glass-1),var(--glass-2));
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi);transition:transform .2s var(--ease)}
.p-card:active{transform:scale(.97)}
@media (hover:hover){.p-card:hover{transform:translateY(-3px)}}
.p-card .n{font-family:var(--font-display);font-size:.95rem;font-weight:700;margin-top:12px;line-height:1.2;word-break:break-word}
.p-card .c{font-size:.72rem;color:var(--text-dim);margin-top:3px}
.back{background:var(--card);border:1px solid var(--line);color:var(--gold);font-weight:700;font-size:.84rem;cursor:pointer;padding:9px 16px;border-radius:999px;margin:4px 0 14px}
.proj-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.proj-head .h1{margin:0;min-width:0;word-break:break-word}

/* ---------- moons: sections ---------- */
.sec{margin-bottom:12px;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass-1),var(--glass-2));box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.sec-head{width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;border:none;cursor:pointer;color:var(--text);text-align:left;
  background:linear-gradient(90deg,color-mix(in srgb,hsl(var(--ah,42) 80% 55%) 14%,transparent),transparent 70%)}
.sec.open .sec-head{border-bottom:1px solid var(--line)}
.sec-icon{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-size:.8rem;font-weight:800;text-transform:uppercase;
  color:color-mix(in srgb,hsl(var(--ah,42) 85% 55%) 40%,var(--text));
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,hsl(var(--ah,42) 85% 62%) 36%,transparent),color-mix(in srgb,hsl(var(--ah,42) 80% 50%) 14%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,hsl(var(--ah,42) 85% 60%) 40%,transparent)}
.sec-head .n{flex:1;min-width:0;font-weight:700;font-size:.92rem;word-break:break-word}
.sec-head .f{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:.76rem;font-weight:700;flex:none}
.chev{display:inline-block;color:var(--text-dim);transition:transform .25s var(--ease)}
.sec.open .chev{transform:rotate(90deg)}
.ring-dot{width:18px;height:18px;border-radius:50%;flex:none;background:conic-gradient(var(--gold) calc(var(--pct,0) * 1%),var(--card-2) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.sec-empty-tag{font-size:.68rem;color:var(--text-dim);font-weight:700;background:var(--card-2);border-radius:999px;padding:2px 9px}
.sec-body{display:none;padding:0 16px 14px}
.sec.open .sec-body{display:block}
.sec.no-tasks{opacity:.62}
.sec.no-tasks.open{opacity:1}

.add-row{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.add-row input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;background:var(--card-2);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:999px;font-size:16px}
.add-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.add-row input::placeholder{color:var(--text-dim)}
.add-row button{flex:none;width:46px;border-radius:50%;border:none;background:var(--grad);color:var(--on-gold);font-size:1.35rem;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -10px var(--glow);transition:transform .15s var(--ease)}
.add-row button:active{transform:scale(.92)}
.link-btn{background:none;border:none;color:var(--text-dim);font-size:.76rem;font-weight:600;cursor:pointer;padding:10px 4px}
@media (hover:hover){.link-btn:hover{color:var(--gold)}}
.dashed{width:100%;background:transparent;border:1.5px dashed var(--line-2);color:var(--text-2);border-radius:26px;padding:15px;font-weight:700;font-size:.88rem;cursor:pointer;transition:border-color .2s,color .2s}
@media (hover:hover){.dashed:hover{border-color:var(--gold);color:var(--gold)}}

/* ---------- Progress ---------- */
.bar{height:9px;border-radius:9px;background:var(--card-2);overflow:hidden;margin:10px 0 7px;box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.bar > div{height:100%;border-radius:inherit;background:var(--grad);box-shadow:0 0 14px -2px var(--glow);transition:width .6s var(--ease)}
.level-card{display:flex;align-items:center;gap:18px}
.level-num{flex:none;width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-gold);
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.45),transparent 42%),var(--grad);box-shadow:0 0 34px -4px var(--glow),inset 0 -6px 12px rgba(0,0,0,.18)}
.level-num b{font-family:var(--font-num);font-size:1.8rem;line-height:1}
.level-num span{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.level-body{flex:1;min-width:0}
.level-body .t{font-family:var(--font-display);font-weight:800;font-size:1.1rem}
.level-body .s{font-size:.76rem;color:var(--text-dim)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.bdg{padding:14px 8px 12px;text-align:center;border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass-1),var(--glass-2));box-shadow:inset 0 1px 0 var(--hi)}
.bdg .e{width:46px;height:46px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:radial-gradient(circle at 30% 25%,var(--gold-soft),transparent 80%),var(--card-2);box-shadow:0 0 18px -6px var(--glow)}
.bdg .n{font-size:.78rem;font-weight:700}
.bdg .d{font-size:.66rem;color:var(--text-dim);margin-top:3px;line-height:1.3}
.bdg.locked{opacity:.5;filter:grayscale(1)}

.chart-card{position:relative;padding:18px 16px 12px;margin-bottom:14px;border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(160deg,var(--glass-1),var(--glass-2));box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.chart-title{font-family:var(--font-display);font-weight:700;font-size:.98rem}
.chart-sub{font-size:.72rem;color:var(--text-dim);margin:2px 0 12px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.gridl{stroke:var(--line);stroke-dasharray:2 5}
.axis{fill:var(--text-dim);font-size:10px}
.barm{fill:var(--chart);fill:url(#gBar) var(--chart);transition:filter .2s}
.hit{fill:transparent;cursor:pointer}
.barm.hot{filter:brightness(1.18) drop-shadow(0 0 6px var(--glow))}
.tip{position:absolute;pointer-events:none;opacity:0;white-space:nowrap;transform:translate(-50%,-110%);background:var(--text);color:var(--bg);padding:5px 11px;border-radius:12px;font-size:.72rem;font-weight:700;box-shadow:var(--shadow-lg);transition:opacity .12s}
.tip.show{opacity:1}
.table-toggle{background:none;border:none;color:var(--gold);font-size:.74rem;font-weight:700;padding:8px 2px;cursor:pointer}
table.data{width:100%;border-collapse:collapse;font-size:.76rem;margin:4px 0 8px}
table.data th{text-align:left;color:var(--text-dim);font-weight:700;padding:6px 4px}
table.data td{padding:6px 4px;border-top:1px solid var(--line)}
.prow{padding:14px 0}
.prow + .prow{border-top:1px solid var(--line)}
.prow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prow .top b{font-family:var(--font-display);font-weight:700}
.prow .bar{margin:8px 0 6px}
.prow .sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:.72rem;color:var(--text-dim)}

/* ---------- Atlas ---------- */
.coach-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:210px}
.msg{max-width:88%;padding:12px 16px;border-radius:24px;font-size:.92rem;line-height:1.5;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--grad);color:var(--on-gold);border-bottom-right-radius:8px;white-space:pre-wrap;box-shadow:0 12px 26px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.msg.assistant{align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:8px;background:linear-gradient(160deg,var(--glass-1),var(--glass-2));box-shadow:inset 0 1px 0 var(--hi)}
.who-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.who{display:flex;align-items:center;gap:5px;font-size:.66rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.09em}
.msg > .who{margin-bottom:5px}
.msg-actions{display:flex;gap:2px}
.icon-mini{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);display:grid;place-items:center;cursor:pointer;padding:0;text-decoration:none}
.icon-mini.on{color:var(--gold)}
@media (hover:hover){.icon-mini:hover{color:var(--gold);background:var(--card)}}
.msg-img{display:block;max-width:200px;border-radius:16px;margin-bottom:8px}
.msg .changes{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.78rem;color:var(--text-2)}
.msg .changes div + div{margin-top:3px}
.msg .undo{margin-top:8px;background:var(--card-2);border:none;color:var(--text);border-radius:999px;padding:8px 14px;font-size:.75rem;font-weight:700;cursor:pointer}
.msg.thinking{display:flex;align-items:center;gap:10px;color:var(--text-2)}
.dots{display:inline-flex;gap:4px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.day-sep{align-self:center;font-size:.68rem;font-weight:700;color:var(--text-dim);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 13px;margin:8px 0 2px}

/* composer: a floating glass pill above the tab bar */
.composer{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom));z-index:35;padding:0 12px;pointer-events:none}
.composer-in{max-width:720px;margin:0 auto;pointer-events:auto}
@media (min-width:1000px){.composer-in{max-width:960px}}
.img-preview{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;margin-bottom:8px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line)}
.img-preview img{width:38px;height:38px;border-radius:12px;object-fit:cover}
.img-preview span{flex:1;min-width:0;font-size:.78rem;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-preview button{width:32px;height:32px;border-radius:50%;border:none;background:var(--card-2);color:var(--text-2);cursor:pointer}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-box{flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px;padding:5px 10px 5px 6px;border-radius:30px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line-2);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi);transition:border-color .2s,box-shadow .2s}
.compose-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft),var(--shadow-lg)}
.compose-box textarea{flex:1;min-width:0;min-height:38px;max-height:140px;resize:none;border:none;outline:none;background:transparent;color:var(--text);font-size:16px;line-height:1.35;padding:9px 4px}
.compose-box textarea::placeholder{color:var(--text-dim)}
.icon-inline{width:38px;height:38px;flex:none;border-radius:50%;border:none;background:transparent;color:var(--text-dim);display:grid;place-items:center;cursor:pointer}
@media (hover:hover){.icon-inline:hover{color:var(--gold)}}
.round{width:52px;height:52px;flex:none;border-radius:50%;border:none;background:var(--grad);color:var(--on-gold);display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 28px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s var(--ease)}
.round:active{transform:scale(.92)}
.round:disabled{opacity:.5;cursor:default}
.compose-hint{font-size:.7rem;color:var(--text-dim);text-align:center;margin-top:5px}
.compose-hint:empty{display:none}

/* ===== Event Horizon · navigation, sheets, drawer, dialogs, toast, auth ===== */
a.btn{text-decoration:none}

/* ---------- floating tab bar with one persistent, sliding bubble ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.tabbar-in{--n:5;--i:0;position:relative;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:6px;border-radius:36px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi);pointer-events:auto}
.tabbar-in::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / var(--n));border-radius:30px;background:linear-gradient(160deg,var(--gold-soft),transparent 80%),var(--card-2);box-shadow:inset 0 1px 0 var(--hi),0 0 26px -8px var(--glow);transform:translateX(calc(var(--i) * 100%));transition:transform .5s var(--ease)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:none;background:none;color:var(--text-dim);font-size:.64rem;font-weight:700;letter-spacing:.01em;cursor:pointer;transition:color .25s,transform .15s var(--ease)}
.tab:active{transform:scale(.92)}
.tab.active{color:var(--gold)}
@media (hover:hover){.tab:not(.active):hover{color:var(--text)}}

/* ---------- add-task orb ---------- */
.fab{position:fixed;right:max(18px,calc((100vw - 960px) / 2));bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom));z-index:35;width:58px;height:58px;border-radius:50%;border:none;background:var(--grad);color:var(--on-gold);display:grid;place-items:center;cursor:pointer;box-shadow:0 18px 34px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .2s var(--ease)}
.fab:active{transform:scale(.9)}
@media (hover:hover){.fab:hover{transform:scale(1.06) rotate(90deg)}}

/* ---------- scrim + glass sheet ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:90vh;overflow-y:auto;padding:10px 20px calc(26px + env(safe-area-inset-bottom));border-radius:32px 32px 0 0;border:1px solid var(--line-2);border-bottom:none;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi);transform:translateY(105%);visibility:hidden;transition:transform .34s var(--ease),visibility 0s .34s}
.sheet.show{transform:translateY(0);visibility:visible;transition:transform .34s var(--ease)}
.sheet-inner{max-width:620px;margin:0 auto}
.handle{width:46px;height:5px;border-radius:5px;background:var(--line-2);margin:4px auto 16px}
@media (min-width:700px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(580px,92vw);max-height:86vh;border-radius:34px;border-bottom:1px solid var(--line-2);padding:24px 26px 26px;opacity:0;transform:translate(-50%,-46%) scale(.97);transition:transform .34s var(--ease),opacity .28s,visibility 0s .34s}
  .sheet.show{opacity:1;transform:translate(-50%,-50%);transition:transform .34s var(--ease),opacity .28s}
  .handle{display:none}
}
.sheet h3{font-family:var(--font-display);font-size:1.28rem;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.sheet p.sub{color:var(--text-dim);font-size:.84rem;line-height:1.5;margin:-6px 0 16px}
.f-label,.card-label{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.f-label{margin:16px 2px 7px}
.card-label{margin:20px 2px 8px}
.sheet input:not([type=checkbox]):not([type=radio]),.sheet select,.sheet textarea,.dlg input{width:100%;background:var(--card-2);border:1px solid var(--line);color:var(--text);padding:14px 18px;border-radius:20px;font-size:16px}
.sheet textarea{min-height:96px;resize:vertical;line-height:1.5}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus,.dlg input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.sheet ::placeholder,.dlg ::placeholder{color:var(--text-dim)}
.sheet .add-row input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin:8px 0 16px}
.sheet .field-card input:not([type=checkbox]):not([type=radio]),.sheet .field-card select{background:transparent;border:none;border-radius:0;box-shadow:none;padding:6px 0;min-width:0}
.sheet .field-card input:focus,.sheet .field-card select:focus{box-shadow:none}
.field-row > div:focus-within{background:var(--gold-soft)}
.field-row{display:grid}
.field-row + .field-row{border-top:1px solid var(--line)}
.field-row.two-col{grid-template-columns:1fr 1fr}
.field-row.three-col{grid-template-columns:repeat(3,1fr)}
.field-row > div{padding:11px 16px;min-width:0}
.field-row > div + div{border-left:1px solid var(--line)}
.field-row .f-label{margin:0 0 3px}
@media (max-width:440px){
  .field-row.three-col{grid-template-columns:1fr 1fr}
  .field-row.three-col > div:last-child{grid-column:1 / -1;border-left:none;border-top:1px solid var(--line)}
}
.sheet .filters{margin:0;flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}
.sheet .filters::after{display:none}
.sheet .filters .fchip{flex:0 1 auto;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle-row{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:.92rem;cursor:pointer}
.toggle-row input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--text-dim);display:grid;place-content:center;cursor:pointer;background:transparent;transition:background .18s,border-color .18s}
.toggle-row input[type=checkbox]::after{content:"";width:6px;height:11px;margin-top:-2px;border:solid var(--on-gold);border-width:0 2.4px 2.4px 0;transform:rotate(45deg) scale(0);transition:transform .18s var(--ease)}
.toggle-row input[type=checkbox]:checked{background:var(--grad);border-color:transparent}
.toggle-row input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.toggle-row input[type=checkbox]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sub-row{display:flex;align-items:center;gap:12px;padding:9px 2px}
.sub-row .check{width:22px;height:22px}
.sub-row span{flex:1;min-width:0;font-size:.92rem;word-break:break-word}
.sub-row.done span{color:var(--done);text-decoration:line-through}
.x{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);font-size:.9rem;cursor:pointer;display:grid;place-items:center}
@media (hover:hover){.x:hover{background:var(--danger-soft);color:var(--danger)}}

/* ---------- side drawer ---------- */
.drawer{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:70;width:324px;max-width:calc(100vw - 20px);overflow-y:auto;padding:16px 16px 20px;border-radius:34px;border:1px solid var(--line-2);background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi);transform:translateX(112%);visibility:hidden;transition:transform .36s var(--ease),visibility 0s .36s}
.drawer.show{transform:none;visibility:visible;transition:transform .36s var(--ease)}
.drawer h4{margin:22px 8px 8px;font-size:.7rem;color:var(--gold);text-transform:uppercase;letter-spacing:.11em}
.drawer .d-close + h4{margin-top:4px}
.d-close{float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text-2);display:grid;place-items:center;cursor:pointer}
.d-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-bottom:8px;padding:13px 16px;text-align:left;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:background .2s,transform .15s var(--ease)}
.d-item:active{transform:scale(.98)}
@media (hover:hover){.d-item:hover{background:var(--card-2)}}
.d-item > span:not(.d-lab):not(.d-state){display:flex;align-items:center;color:var(--text-dim)}
.d-lab{display:block;min-width:0}
.d-sub{display:block;font-size:.72rem;color:var(--text-dim);font-weight:400}
.d-state{color:var(--text-dim);font-size:.78rem;white-space:nowrap}
.d-state.on{color:var(--gold)}
#importFile{display:none}

/* ---------- dialogs ---------- */
.dlg-back{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{width:100%;max-width:380px;padding:26px 24px 22px;border-radius:34px;border:1px solid var(--line-2);background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi);animation:fadein .2s var(--ease)}
.dlg h4{font-family:var(--font-display);font-size:1.18rem;font-weight:800;margin:0 0 6px}
.dlg p{margin:0 0 16px;color:var(--text-2);font-size:.9rem;line-height:1.5}
.dlg h4 .dot{color:var(--gold)}
.dlg .btn-row{margin-top:16px}

/* ---------- toast, xp, confetti ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 92px + env(safe-area-inset-bottom));z-index:90;max-width:88vw;padding:12px 22px;border-radius:999px;background:var(--text);color:var(--bg);font-size:.84rem;font-weight:700;text-align:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .25s,transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.xp-pop{position:fixed;z-index:95;pointer-events:none;font-family:var(--font-num);font-weight:800;font-size:.95rem;color:var(--gold);text-shadow:0 2px 14px var(--glow);transform:translate(-50%,0);animation:xpup .95s var(--ease) forwards}
@keyframes xpup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-44px)}}
#confetti{position:fixed;inset:0;z-index:96;pointer-events:none}

/* ---------- appearance picker ---------- */
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.look{padding:9px 9px 12px;border-radius:26px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:.8rem;font-weight:700;text-align:center;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .15s var(--ease)}
.look:active{transform:scale(.96)}
.look.on{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.sw{position:relative;height:66px;margin-bottom:9px;border-radius:19px;overflow:hidden;background:var(--a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sw::before{content:"";position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:radial-gradient(circle,#000 0 54%,transparent 56%),conic-gradient(from 210deg,var(--b),var(--c),var(--b));filter:drop-shadow(0 0 8px var(--c))}

/* ---------- sign-in gate ---------- */
.auth{z-index:200;flex-direction:column;background:var(--bg)}
.auth::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(62% 44% at 10% -4%,var(--aura-1),transparent 72%),radial-gradient(56% 42% at 104% 46%,var(--aura-2),transparent 72%),radial-gradient(74% 46% at 28% 106%,var(--aura-3),transparent 72%)}
.auth .dlg{position:relative;max-width:360px;padding:30px 26px 26px}
.auth .dlg h4{font-size:1.55rem;text-align:center;margin-bottom:4px}
.auth .dlg p{text-align:center}
.auth .dlg input{margin-bottom:10px}
.auth-mark{position:relative;width:78px;height:78px;margin:0 auto 16px;border-radius:50%;background:radial-gradient(circle,var(--hole) 0 38%,transparent 41%),var(--mark);box-shadow:0 0 48px -4px var(--glow),inset 0 0 0 1px rgba(255,255,255,.2)}
.auth-mark::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,transparent 46%,var(--glow) 58%,transparent 72%);opacity:.7;filter:blur(6px);pointer-events:none}
.auth-err{color:var(--danger);font-size:.82rem;margin-top:2px;min-height:1.2em;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Event Horizon · Me tab (private profile) + import preview ===== */
.me-card{display:flex;align-items:center;gap:16px;padding:18px}
.me-orb{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:var(--font-display);font-weight:800;font-size:1.65rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
  background:radial-gradient(circle at 28% 22%,hsl(var(--ah,42) 90% 68%) 0,hsl(var(--ah,42) 72% 27%) 26%,hsl(var(--ah,42) 70% 15%) 100%);
  box-shadow:0 0 28px -4px hsl(var(--ah,42) 85% 58% / .7),inset 0 0 0 1px hsl(var(--ah,42) 90% 82% / .25),inset -6px -9px 14px rgba(0,0,0,.35)}
.me-orb.lg{width:84px;height:84px;font-size:2.1rem}
.me-orb.sm{width:46px;height:46px;font-size:1.15rem;box-shadow:0 0 18px -4px hsl(var(--ah,42) 85% 58% / .7),inset 0 0 0 1px hsl(var(--ah,42) 90% 82% / .25),inset -4px -6px 9px rgba(0,0,0,.35)}
.me-orb:active{transform:scale(.96)}
.me-id{flex:1;min-width:0}
@media (max-width:340px){.me-card{gap:10px;padding:16px 14px}.me-card .me-orb{width:54px;height:54px;font-size:1.35rem}}
.me-name{font-family:var(--font-display);font-size:1.35rem;font-weight:800;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
:root[data-look="nebula"] .me-name{font-size:1.06rem;letter-spacing:0}
.me-tag{margin-top:3px;font-size:.84rem;color:var(--text-dim);line-height:1.35;overflow-wrap:anywhere}
.me-about{font-size:.92rem;line-height:1.62;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.me-empty .hero-top{flex-direction:column;align-items:flex-start;gap:16px}
.me-empty .coach-note{margin:0}

.me-share{display:flex;align-items:center;gap:14px;padding:16px 18px}
.me-share-t{flex:1;min-width:0}
.me-share-t b{display:block;font-size:.94rem;margin-bottom:3px}
.me-share-t span{display:block;font-size:.78rem;line-height:1.5;color:var(--text-dim)}
.switch{position:relative;flex:none;width:54px;height:32px;display:block;cursor:pointer}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--card-2);border:1px solid var(--line-2);box-shadow:inset 0 2px 5px rgba(0,0,0,.18);transition:background .25s,border-color .25s,box-shadow .25s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text-2);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .3s var(--ease),background .25s}
.switch input:checked + i{background:var(--grad);border-color:transparent;box-shadow:0 0 18px -4px var(--glow)}
.switch input:checked + i::after{transform:translateX(22px);background:#fff}
.switch input:focus-visible + i{outline:2px solid var(--gold);outline-offset:3px}

.facts{padding:2px 16px}
.fact{display:flex;align-items:flex-start;gap:10px;padding:13px 0}
.fact + .fact{border-top:1px solid var(--line)}
.fact-t{flex:1;min-width:0;display:block;margin:0;padding:0;border:none;background:none;text-align:left;color:var(--text);font:inherit;font-size:.92rem;line-height:1.5;overflow-wrap:anywhere;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fact-t:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.fact-t .chip{margin-left:6px;vertical-align:1px}
.chip.inferred{background:transparent;border:1px dashed var(--line-2);color:var(--text-dim);font-weight:500}
.me-tools{margin-top:22px}
.me-note{margin:14px 6px 0;font-size:.74rem;line-height:1.55;color:var(--text-dim);text-align:center}

/* ---------- import preview sheet ---------- */
.imp-sum{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.imp-scroll{max-height:min(46vh,430px);overflow-y:auto;margin:0 -8px;padding:0 8px;overscroll-behavior:contain}
.imp-group{margin-bottom:14px}
.imp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 2px 4px;font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.imp-h .count{background:var(--card-2);color:var(--text-2);border-radius:999px;padding:2px 9px;font-size:.66rem;letter-spacing:0;text-transform:none}
.imp-sec{margin:10px 2px 2px;font-size:.78rem;font-weight:700;color:var(--text-2)}
.imp-row{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;cursor:pointer}
.imp-row + .imp-row{border-top:1px solid var(--line)}
.imp-row input{-webkit-appearance:none;appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border-radius:50%;border:2px solid var(--text-dim);display:grid;place-content:center;cursor:pointer;background:transparent;transition:background .18s,border-color .18s}
.imp-row input::after{content:"";width:5px;height:10px;margin-top:-2px;border:solid var(--on-gold);border-width:0 2.4px 2.4px 0;transform:rotate(45deg) scale(0);transition:transform .18s var(--ease)}
.imp-row input:checked{background:var(--grad);border-color:transparent}
.imp-row input:checked::after{transform:rotate(45deg) scale(1)}
.imp-row input:disabled{opacity:.45;cursor:default}
.imp-t{flex:1;min-width:0;font-size:.88rem;line-height:1.45;overflow-wrap:anywhere}
.imp-t small{display:block;margin-top:2px;font-size:.72rem;color:var(--text-dim)}
.imp-row.dup{opacity:.55;cursor:default}
.imp-row .chip{align-self:center;flex:none}

/* ---------- profile sheet: colour picker ---------- */
.hues{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:8px 2px 2px}
.hue{width:100%;max-width:40px;aspect-ratio:1;justify-self:center;border-radius:50%;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 30% 24%,hsl(var(--h) 90% 70%) 0,hsl(var(--h) 72% 32%) 56%,hsl(var(--h) 70% 18%) 100%);
  box-shadow:inset 0 0 0 1px hsl(var(--h) 90% 82% / .3),0 0 16px -4px hsl(var(--h) 85% 58% / .6);
  transition:transform .22s var(--ease),box-shadow .22s}
.hue:active{transform:scale(.94)}
.hue.on{transform:scale(1.1);outline:2px solid hsl(var(--h) 90% 66%);outline-offset:3px;box-shadow:inset 0 0 0 1px hsl(var(--h) 90% 82% / .3),0 0 20px -2px hsl(var(--h) 85% 58% / .75)}
.hue:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.qc{display:flex;gap:8px;align-items:center;margin:2px 0 12px;padding:6px 6px 6px 16px;border-radius:30px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.qc input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:.92rem}
.qc button{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;background:var(--card-2);color:var(--text);font-size:1rem}
.qc .qc-go{background:var(--grad);color:var(--on-gold);font-weight:800}
.wk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:6px}.wk-row b{display:block;font-family:var(--font-num);font-size:1.15rem}.wk-row span{font-size:.7rem;opacity:.7}
.wk-row i{font-style:normal;font-size:.65rem}.wk-row i.up{color:#6fd39a}.wk-row i.dn{color:#f08a7a}.wk.hot{box-shadow:0 0 0 1px var(--glow),0 12px 32px -12px var(--glow)}
.sites{padding:6px 14px 10px}.site{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.9rem}.site span{flex:1}.site em{font-style:normal;opacity:.65;font-size:.78rem}
.site i{width:10px;height:10px;border-radius:50%;background:#888}.site i.up{background:#5fd18f;box-shadow:0 0 10px #5fd18f}.site i.dn{background:#f06a5a;box-shadow:0 0 10px #f06a5a}.site i.chk{animation:pulse 1s infinite alternate}
.deal.late{box-shadow:inset 3px 0 0 #f06a5a}.dn-t{color:#f08a7a}.deal .adv{font-size:1.05rem}
.fl{display:block;font-size:.78rem;opacity:.9;margin:10px 0 0}.fl input,.fl select{display:block;width:100%;margin-top:4px;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card-2);color:var(--text);font:inherit}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats-row .tile .v{font-size:1rem}
@keyframes pulse{to{opacity:.3}}
</style>
</head>

<script>
const DEFAULT_DATA = [

    { name:"Trust Building", items:["Improve FAQ","Explain escrow process clearly","Add trust badges","Add security information","Add privacy policy","Improve Terms of Service","Add testimonials (when available)","Add case studies"]},
    { name:"SEO", items:["Check indexed pages","Add sitemap","Improve metadata","Improve internal linking","Research Nigerian escrow keywords","Publish SEO blog posts"]},

    { name:"Content — Product", items:["Feature videos","Walkthrough videos","Product updates","Behind the scenes","User tutorials"]},
    { name:"Advertising Research", items:["Research Meta Ads","Research Google Search Ads","Research TikTok Ads","Research YouTube Ads","Study competitors","Research best-performing escrow ads","Build customer personas"]},
    { name:"Advertising Assets", items:["Landing pages","Video ads","Image ads","Carousel ads","10 ad copies","Install Meta Pixel","Install Google Analytics","Install Microsoft Clarity","Set conversion tracking"]},
    { name:"Growth", items:["Referral program","Email marketing","Affiliate program","Partnership strategy","Influencer outreach","Campus ambassador program"]},
    { name:"Analytics", items:["Track users","Track transactions","Track conversions","Track abandoned signups","Weekly growth report"]},
  ]},
  { id:"cvg", emoji:"💻", title:"CVG", subs:[
    { name:"Core", items:["Make CVG fully usable","Fix bugs","Improve UI","Test on mobile","Connect to JKB Global","Start posting about CVG"]},
  ]},
  { id:"ceo", emoji:"📈", title:"Weekly CEO Routine", subs:[
    { name:"Routine", items:["Review analytics","Review AI workflows","Review content performance","Improve one workflow","Improve one landing page","Launch one new feature","Publish at least one case study","Plan next week's content","Follow up with leads","Reach out to potential clients"]},
  ]},
];

// ===================================================================
// utilities
// ===================================================================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const lsGet = (k) => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const lsDel = (k) => { try{ localStorage.removeItem(k); }catch(e){} };
const LS_STATE = "jkb_v2_state", LS_COACH = "jkb_v2_coach", LS_UI = "jkb_v2_ui", LS_OLD = "jkb_checklist_state_v3", LS_THEME = "jkb_checklist_theme", LS_TIMER = "jkb_v2_timer";
const VOICE_URL = "https://checklist.jkbglobal.site/voice.html";
const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="var(--on-gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const DAY = 86400000;

function dayStr(d = new Date()){ const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
function parseDay(s){ const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n){ const d = parseDay(s); d.setDate(d.getDate() + n); return dayStr(d); }
function daysBetween(a, b){ return Math.round((parseDay(b) - parseDay(a)) / DAY); }
function weekdayShort(s){ return parseDay(s).toLocaleDateString(undefined, { weekday:"short" }); }
function fmtDue(due){
  const diff = daysBetween(dayStr(), due);
  if(diff === 0) return "Today";
  if(diff === 1) return "Tomorrow";
  if(diff === -1) return "Yesterday";
  if(diff < 0) return (-diff) + "d overdue";
  if(diff < 7) return weekdayShort(due);
  return parseDay(due).toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function fmtTime(t){
  if(!t) return "";
  const [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM", h12 = ((h + 11) % 12) + 1;
  return h12 + ":" + String(m).padStart(2, "0") + " " + ap;
}
function fmtMin(m){ m = Math.round(m); return m >= 60 ? Math.floor(m / 60) + "h " + (m % 60 ? (m % 60) + "m" : "") : m + "m"; }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate(30); }catch(e){} }
// light markdown for coach replies: **bold** and "- " bullets
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^[-•] (.*)$/gm, "• $1").replace(/\n/g, "<br>"); }

// ===================================================================
// state
// ===================================================================
// state: { v:2, nextId, savedAt,
//   projects:[{id, emoji, title, sections:[{id, name, tasks:[Task]}]}],
//   today:{date, focus:[ids], note}, checkins:[...], sessions:[{taskId, min, end}] }
// Task: { id, text, done, doneAt, priority, due, createdAt, repeat, subtasks:[{id,text,done}], minutes }
let state = null;
let coach = { messages: [], savedAt: 0 };
let ui = { tab:"today", project:null, open:{}, filter:"all", q:"", projFilter:"", tagFilter:"", tasksView:"projects" };
try{ const u = JSON.parse(lsGet(LS_UI) || "{}"); ui.open = u.open || {}; }catch(e){}
const saveUi = () => lsSet(LS_UI, JSON.stringify({ open: ui.open }));

function newId(prefix){ state.nextId = (state.nextId || 1) + 1; return prefix + state.nextId.toString(36); }
function blankState(){ return { v:2, nextId:1, savedAt:0, projects:[], today:{ date:"", focus:[], note:"" }, checkins:[], sessions:[] }; }

function fromOld(old){
  state = blankState();
  (old.data || []).forEach(g => {
    const p = { id:g.id, emoji:g.emoji || "📌", title:g.title, sections:[] };
    (g.subs || []).forEach((sub, si) => {
      const s = { id:newId("s"), name:sub.name, tasks:[] };
      (sub.items || []).forEach((text, ii) => {
        const done = !!(old.checked || {})[g.id + "::" + si + "::" + ii];
        s.tasks.push({ id:newId("t"), text, done, doneAt:null, priority:"normal", due:null, createdAt:Date.now() });
      });
      p.sections.push(s);
    });
    state.projects.push(p);
  });
}
// ---------- profile ("Me"): private notes about the owner. Lives in state.profile, so it syncs with the account.
// Atlas receives it only while profile.share is on. Nothing personal is hard-coded in this file.
const FACT_GROUPS = [["who", "About me"], ["work", "How I work"], ["taste", "Taste"], ["rules", "Ground rules"], ["projects", "What I'm building"], ["tools", "My setup"]];
const PROFILE_HUE = 38, MAX_FACTS = 120;
const clip = (s, n) => String(s == null ? "" : s).replace(/\r/g, "").trim().slice(0, n);
function cleanProfile(p){
  const src = p && typeof p === "object" ? p : {};
  const used = new Set();
  const facts = (Array.isArray(src.facts) ? src.facts : []).map(f => {
    if(!f || typeof f !== "object") return null;
    const t = clip(f.t, 240).replace(/\s*\n+\s*/g, " ");
    if(!t) return null;
    let id = typeof f.id === "string" && /^[A-Za-z0-9_-]{1,12}$/.test(f.id) ? f.id : "";
    if(!id || used.has(id)) id = newId("f");
    used.add(id);

      coach.messages = merged; lastCoachSave = Math.max(lastCoachSave, row.coach_saved_at || 0); lsSet(LS_COACH, JSON.stringify(coach));
      if(ui.tab === "coach" || ui.tab === "today") render();
    }
  }
}

async function connectCloud(){
  if(!authUser) return;
  try{
    const { data: row } = await sb.from("app_state").select("state,state_saved_at,coach,coach_saved_at").eq("user_id", authUser.id).maybeSingle();
    if(row && row.state && row.state.v === 2 && Array.isArray(row.state.projects)){
      if((row.state_saved_at || 0) >= (state.savedAt || 0)){ state = clone(row.state); normalize(); lastStateSave = state.savedAt || 0; lsSet(LS_STATE, JSON.stringify(state)); }
      if((state.savedAt || 0) > (row.state_saved_at || 0)) save();
    } else { normalize(); save(); }
    if(row && row.coach && Array.isArray(row.coach.messages)){
      const merged = mergeMessages(coach.messages, row.coach.messages);
      const changed = JSON.stringify(merged) !== JSON.stringify(row.coach.messages);
      coach.messages = merged;
      lastCoachSave = Math.max(lastCoachSave, row.coach_saved_at || 0);
      if(changed) saveCoach(); else lsSet(LS_COACH, JSON.stringify(coach));
    } else if(coach.messages.length) saveCoach();
    render();
    openPendingImport();
    sb.channel("app_state_" + authUser.id)
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"app_state", filter:"user_id=eq." + authUser.id }, payload => applyCloudRow(payload.new))
      .subscribe();
  }catch(e){}
}

// ===================================================================
// focus timer
// ===================================================================
let timer = null; // { taskId, text, durationMin, startedAt, elapsedMs, paused }
try{ timer = JSON.parse(lsGet(LS_TIMER) || "null"); }catch(e){}
function timerElapsed(){ return timer ? timer.elapsedMs + (timer.paused ? 0 : Date.now() - timer.startedAt) : 0; }
function startTimer(taskId, min){
  const x = findTask(taskId);
  if(!x) return;
  if(timer) finishTimer(false);
  timer = { taskId, text:x.t.text, durationMin:min, startedAt:Date.now(), elapsedMs:0, paused:false };
  lsSet(LS_TIMER, JSON.stringify(timer));
  closeSheet(); tickTimer(); buzz();
  toast("Focus on. " + min + " minutes — phone down.");
}
function pauseTimer(){
  if(!timer) return;
  if(timer.paused){ timer.paused = false; timer.startedAt = Date.now(); }
  else{ timer.elapsedMs = timerElapsed(); timer.paused = true; }
  lsSet(LS_TIMER, JSON.stringify(timer)); tickTimer();
}
function finishTimer(completed){
  if(!timer) return;
  const min = Math.min(timer.durationMin, timerElapsed() / 60000);
  const t = timer;
  timer = null; lsDel(LS_TIMER);
  $("#timer").hidden = true;
  if(min >= 1){
    state.sessions.push({ taskId:t.taskId, min:Math.round(min), end:Date.now() });
    const x = findTask(t.taskId);
    if(x) x.t.minutes = (x.t.minutes || 0) + Math.round(min);
    save();
  }
  if(completed){
    buzz();
    const x = findTask(t.taskId);
    openSheet(`<h3>Time's up</h3><p class="sub">${fmtMin(min)} on <b>${esc(t.text)}</b>. Is it done?</p>
      <div class="btn-row">${x && !x.t.done ? `<button class="btn" data-act="toggle" data-id="${esc(t.taskId)}" data-close="1">✓ Mark done</button>` : ""}
      <button class="btn soft" data-act="timerAgain" data-id="${esc(t.taskId)}">Another 25</button>
      <button class="btn ghost" data-act="closeSheet">Break</button></div>`);
  }
  render();
}
function tickTimer(){
  const el = $("#timer");
  if(!timer){ el.hidden = true; return; }
  el.hidden = false;
  const left = Math.max(0, timer.durationMin * 60000 - timerElapsed());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  $("#timerTime").textContent = m + ":" + String(s).padStart(2, "0");
  $("#timerName").textContent = timer.text;
  $("#timerPause").innerHTML = timer.paused ? '<svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M7 4l13 8-13 8V4z" fill="currentColor" stroke="none"/></svg>' : '<svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></svg>';
  el.classList.toggle("paused", timer.paused);
  if(left <= 0) finishTimer(true);
}
setInterval(tickTimer, 1000);
$("#timerPause").addEventListener("click", pauseTimer);
$("#timerStop").addEventListener("click", async () => { if(await confirmBox("Stop the focus timer?", "The time you've done so far is kept.", "Stop", false)) finishTimer(false); });

function monogram(title){
  const w = String(title || "").trim().split(/\s+/).filter(Boolean);
  const s = (w[0]?.[0] || "?") + (w.length > 1 ? w[1][0] : "");
  return s.toUpperCase();
}
function hueFor(id){ let h = 0; id = String(id); for(let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return Math.round((h * 137.508) % 360); }
function projectIcon(p, opts = {}){
  const big = opts === true || opts.big;
  const mono = `<div class="p-mono${big ? " lg" : ""}">${esc(monogram(p.title))}</div>`;
  if(opts.pct == null) return mono;
  return `<div class="p-ring${big ? " lg" : ""}" style="--pct:${opts.pct}">${mono}</div>`;
}

function taskRow(x, opts = {}){
  const { t, p, s } = x;
  const chips = [];
  if(t.priority === "high" && !t.done) chips.push(`<span class="chip high">High</span>`);
  if(t.due && !t.done){ const over = daysBetween(dayStr(), t.due) < 0; const label = fmtDue(t.due) + (t.time ? " · " + fmtTime(t.time) : ""); chips.push(`<span class="chip ${over ? "over" : "due"}">${esc(label)}</span>`); }
  else if(t.time && !t.done){ chips.push(`<span class="chip due">${esc(fmtTime(t.time))}</span>`); }
  if(t.repeat) chips.push(`<span class="chip">↻ ${repeatLabel(t.repeat)}</span>`);
  if(t.subtasks && t.subtasks.length){ const d = t.subtasks.filter(z => z.done).length; chips.push(`<span class="chip${d === t.subtasks.length ? " ok" : ""}">☰ ${d}/${t.subtasks.length}</span>`); }
  if(t.minutes) chips.push(`<span class="chip">${STOPWATCH_ICO} ${fmtMin(t.minutes)}</span>`);
  const where = opts.showWhere ? `<span>${esc(p.title)} · ${esc(s.name)}</span>` : "";
  const meta = where || chips.length ? `<div class="t-meta">${where}${chips.join("")}</div>` : "";
  const tags = (t.tags || []).length
    ? `<div class="tags-row">${t.tags.map(tag => `<span class="chip tag" data-act="filterTag" data-tag="${esc(tag)}">#${esc(tag)}</span>`).join("")}</div>` : "";
  const play = opts.play && !t.done ? `<button class="play" data-act="quickTimer" data-id="${t.id}" aria-label="Start focus timer">▶</button>` : "";
  return `<div class="task${t.done ? " done" : ""}">
    <button class="check${t.done ? " done" : ""}" data-act="toggle" data-id="${t.id}" aria-label="${t.done ? "Mark not done" : "Mark done"}">${CHECK_SVG}</button>
    <div class="t-main" data-act="edit" data-id="${t.id}"><div class="t-text">${esc(t.text)}</div>${meta}${tags}</div>${play}
  </div>`;
}
// Progress ring drawn as a small event horizon: black disc, glowing accretion arc, one orbiting speck.
function ringSvg(frac, size = 96, stroke = 8){
  const c0 = size / 2, r = (size - stroke) / 2 - 6, c = 2 * Math.PI * r;
  const f = Math.max(0, Math.min(1, frac));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${c0}" cy="${c0}" r="${r - stroke / 2 - 1}" fill="var(--hole)"/>
    <circle cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="${stroke}"/>
    <circle cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="url(#gRing)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}" transform="rotate(-90 ${c0} ${c0})" style="transition:stroke-dashoffset .6s var(--ease)"/>
    <g class="rg-orbit"><circle cx="${c0}" cy="${c0 - (r + stroke / 2 + 4.5)}" r="2.6" fill="var(--ring-a)"/></g>
  </svg>`;
}

// ---------- Tasks ----------
const FILTERS = [["all", "All"], ["today", "Today"], ["week", "This week"], ["overdue", "Overdue"], ["high", "High priority"], ["repeat", "Recurring"], ["nodate", "No date"], ["done", "Done"]];
function matchFilter(x){
  const t = x.t, today = dayStr();
  switch(ui.filter){
    case "today": return !t.done && (t.due === today || todayFocus().some(f => f.t.id === t.id));
    case "week": return !t.done && t.due && daysBetween(today, t.due) <= 7;
    case "overdue": return !t.done && t.due && daysBetween(today, t.due) < 0;
    case "high": return !t.done && t.priority === "high";
    case "repeat": return !t.done && !!t.repeat;
    case "nodate": return !t.done && !t.due;
    case "done": return t.done;
    default: return true;
  }
}
function renderTasks(){
  if(ui.project){
    const p = state.projects.find(x => x.id === ui.project);
    if(p) return renderProject(p);
    ui.project = null;
  }
  const q = ui.q.trim().toLowerCase();
  const searching = q || ui.filter !== "all" || ui.projFilter || ui.tagFilter;

  const head = `<div class="eyebrow">Everything on your plate</div><div class="h1">Your <span class="accent">Tasks</span></div>
    <div class="search"><span class="si">⌕</span><input id="searchBox" type="search" placeholder="Search tasks…" value="${esc(ui.q)}" autocomplete="off"></div>
    <div class="filters">${FILTERS.map(([id, label]) => `<button class="fchip${ui.filter === id ? " on" : ""}" data-act="filter" data-id="${id}">${label}</button>`).join("")}
      <select class="fchip" id="projFilter" style="appearance:auto">${[`<option value="">All projects</option>`, ...state.projects.map(p => `<option value="${esc(p.id)}"${ui.projFilter === p.id ? " selected" : ""}>${esc(p.title)}</option>`)].join("")}</select>
    </div>
    ${allTags.length ? `<div class="filters">${allTags.map(tag => `<button class="fchip${ui.tagFilter === tag ? " on" : ""}" data-act="tagFilter" data-tag="${esc(tag)}">#${esc(tag)}</button>`).join("")}</div>` : ""}`;
  if(searching){

    if(q) list = list.filter(x => (x.t.text + " " + x.s.name + " " + x.p.title + " " + (x.t.subtasks || []).map(z => z.text).join(" ") + " " + (x.t.tags || []).join(" ")).toLowerCase().includes(q));
    if(ui.filter !== "done" && !q) list = list.filter(x => !x.t.done || ui.filter === "all");
    const rank = x => (x.t.done ? 1e9 : 0) + (x.t.due ? daysBetween(dayStr(), x.t.due) * 10 : 5000) + (x.t.priority === "high" ? -3 : x.t.priority === "low" ? 3 : 0);
    list.sort((a, b) => rank(a) - rank(b));

      <div class="label">${list.length} task${list.length === 1 ? "" : "s"}</div>

  return `<div class="view-in">${head}${viewToggle}

// Schedule view: the same open tasks, laid out as a day-by-day agenda instead of by project.
function renderSchedule(){
  const today = dayStr();
  const open = allTasks().filter(x => !x.t.done);
  const overdue = sortWrapped(open.filter(x => x.t.due && daysBetween(today, x.t.due) < 0));
  const noDate = sortWrapped(open.filter(x => !x.t.due));
  const dated = open.filter(x => x.t.due && daysBetween(today, x.t.due) >= 0);
  const byDay = {};
  dated.forEach(x => (byDay[x.t.due] = byDay[x.t.due] || []).push(x));
  const days = Object.keys(byDay).sort();
  const dayLabel = (d) => {
    const diff = daysBetween(today, d);
    if(diff === 0) return "Today";
    if(diff === 1) return "Tomorrow";
    return parseDay(d).toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  };
  const rows = (items) => items.map(x => taskRow(x, { showWhere:true, play:true })).join("");
  const day = (label, items, danger) => `<div class="label"${danger ? ' style="color:var(--danger)"' : ""}>${esc(label)}<span class="count">${items.length}</span></div><div class="card">${rows(items)}</div>`;
  return [
    overdue.length ? day("Overdue", overdue, true) : "",
    days.map(d => day(dayLabel(d), sortWrapped(byDay[d]))).join(""),
    !days.length && !overdue.length ? `<div class="empty"><b>Nothing scheduled</b>Give a task a due date to see it here.</div>` : "",
    noDate.length ? day("No due date", noDate.slice(0, 40)) : "",
  ].join("");
}
function renderProject(p){
  const ah = hueFor(p.id);

  // Sections with real tasks surface first — empty ones (nothing added yet) sink to the bottom.

    const visible = active ? s.tasks.filter(t => (t.tags || []).includes(active)) : s.tasks;

    return `<div class="sec${ui.open[key] ? " open" : ""}${s.tasks.length ? "" : " no-tasks"}" style="--ah:${ah}">
      <button class="sec-head" data-act="toggleSec" data-key="${esc(key)}"><span class="sec-icon">${esc(s.name.trim()[0] || "?")}</span><span class="n">${esc(s.name)}</span><span class="f">${countLabel}<span class="chev">▸</span></span></button>
      <div class="sec-body">
        ${tasks}
        <div class="add-row"><input placeholder="Add task…" data-add="${esc(p.id)}|${esc(s.id)}"><button data-act="addTask" data-sec="${esc(p.id)}|${esc(s.id)}" aria-label="Add">+</button></div>
        <div style="display:flex;justify-content:space-between"><button class="link-btn" data-act="renameSec" data-sec="${esc(p.id)}|${esc(s.id)}">rename</button><button class="link-btn" data-act="delSec" data-sec="${esc(p.id)}|${esc(s.id)}">remove section ✕</button></div>
      </div>
    </div>`;

let showTables = {};
function barChart(id, data, fmt){
  // data: [{label, full, value}] — single series, gold bars on a zero baseline
  const W = 340, H = 150, padL = 26, padB = 20, padT = 10;
  const max = Math.max(1, ...data.map(d => d.value));
  const nice = max <= 4 ? 4 : max <= 10 ? Math.ceil(max / 2) * 2 : Math.ceil(max / 10) * 10;
  const n = data.length, slot = (W - padL) / n, bw = Math.max(6, Math.min(22, slot - 6));
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  const ticks = [0, nice / 2, nice];
  const bars = data.map((d, i) => {
    const x = padL + slot * i + (slot - bw) / 2;
    const top = y(d.value), h = (H - padB) - top;
    const r = Math.min(4, bw / 2, h);
    // rounded top, square base anchored to the baseline
    const path = h > 0 ? `M${x},${H - padB} L${x},${top + r} Q${x},${top} ${x + r},${top} L${x + bw - r},${top} Q${x + bw},${top} ${x + bw},${top + r} L${x + bw},${H - padB} Z` : "";
    const showLabel = n <= 7 || i % 2 === (n - 1) % 2;
    return `<g><rect class="hit" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${H - padT}" data-tip="${esc(d.full + ": " + fmt(d.value))}"/>${path ? `<path class="barm" d="${path}"/>` : ""}
      ${showLabel ? `<text class="axis" x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${esc(d.label)}</text>` : ""}</g>`;
  }).join("");
  const grid = ticks.map(t => `<line class="gridl" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${padL - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join("");
  const table = showTables[id] ? `<table class="data"><tr><th>Day</th><th>Value</th></tr>${data.map(d => `<tr><td>${esc(d.full)}</td><td>${esc(fmt(d.value))}</td></tr>`).join("")}</table>` : "";
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="bar chart">${grid}${bars}</svg><div class="tip"></div></div>
    <button class="table-toggle" data-act="toggleTable" data-id="${id}">${showTables[id] ? "Hide table" : "Show as table"}</button>${table}`;
}

function downscaleImage(file, maxDim = 160, quality = 0.55){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* quick capture */
function parseCapture(raw){
  let text = raw, due = null, priority = "normal"; const tags = [];
  const days = ["sun","mon","tue","wed","thu","fri","sat"];
  text = text.replace(/(^|\s)#([\w-]+)/g, (m, a, t) => { tags.push(t.toLowerCase()); return a; });
  if(/(^|\s)!(high)?(\s|$)/i.test(text)){ priority = "high"; text = text.replace(/(^|\s)!(high)?(?=\s|$)/gi, " "); }
  const m = text.match(/\b(today|tonight|tomorrow|tmrw|(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*)\b/i);
  if(m){
    const w = m[1].toLowerCase();
    if(w === "today" || w === "tonight") due = dayStr();
    else if(w === "tomorrow" || w === "tmrw") due = addDays(dayStr(), 1);
    else { const t = days.indexOf(w.slice(0, 3)); let n = (t - new Date().getDay() + 7) % 7; if(!n) n = 7; due = addDays(dayStr(), n); }
    text = text.replace(m[0], " ");
  }
  text = text.replace(/\s+/g, " ").trim().replace(/^(remind me to|remember to|to)\s+/i, "");
  return { text: text.charAt(0).toUpperCase() + text.slice(1), due, priority, tags };
}
function quickCapture(raw){

}
